name: tests-and-build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked test dependencies
        run: npm ci --ignore-scripts
      - name: Test synthetic data and access boundaries
        run: npm test
      - name: Build static website
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: python tools/generate_setup.py && python tools/build.py
      - name: Upload static web build
        uses: actions/upload-artifact@v7
        with:
          name: couple-diary-web-${{ github.sha }}
          path: |
            dist/index.html
            dist/_headers
          if-no-files-found: error
          retention-days: 14
