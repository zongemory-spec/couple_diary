<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="380" viewBox="0 0 1120 380" role="img" aria-labelledby="title desc">
  <title id="title">Couple Diary — A little home for two.</title>
  <desc id="desc">Four illustrated windows: cherry blossoms, summer fireworks, five-lobed maple leaves, and a softly lit snowy night.</desc>
  <defs>
