    <g id="burst" fill="none" stroke-linecap="round"><path d="M0-14V-32M10-10 24-24M14 0H34M10 10 24 24M0 14V32M-10 10-24 24M-14 0H-34M-10-10-24-24"/><path d="M5-12 11-26M12-5 28-11M12 5 28 11M5 12 11 26M-5 12-11 26M-12 5-28 11M-12-5-28-11M-5-12-11-26" opacity=".5" stroke-width="1.3"/></g>
