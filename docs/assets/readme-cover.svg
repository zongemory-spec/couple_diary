    <text x="56" y="150" font-size="52" font-weight="600" letter-spacing="-2" fill="#513d51">Couple Diary</text>
    <text x="60" y="194" font-size="23" fill="#7d6275">A little home for two.</text>
    <path d="M62 231H112" stroke="#b58a9d" stroke-width="3" stroke-linecap="round"/>
    <text x="60" y="270" font-size="15" fill="#806c7a">Small moments. Shared memories.</text>
    <text x="60" y="295" font-size="15" fill="#806c7a">Seasons to come back to.</text>
  </g>
