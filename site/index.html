<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5eee7"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="assets/black-cross.png"><title>我们的恋爱日记</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="themes.css"><link rel="stylesheet" href="refinement.css"><link rel="stylesheet" href="scenery.css"><link rel="stylesheet" href="experience.css"><link rel="stylesheet" href="legibility.css"><link rel="stylesheet" href="motion.css"><link rel="stylesheet" href="private.css"><link rel="stylesheet" href="mobile.css"><link rel="stylesheet" href="upgrade.css"><link rel="stylesheet" href="status.css"><link rel="stylesheet" href="meeting.css"><link rel="stylesheet" href="navigation.css"></head>
<body class="auth-locked">
<div class="scene-backgrounds" aria-hidden="true"><img class="scene-image spring" src="assets/spring-scene.jpg" alt="" decoding="async"><img class="scene-image summer" src="assets/summer-scene.jpg" alt="" decoding="async"><img class="scene-image autumn" src="assets/autumn-scene.jpg" alt="" decoding="async"><img class="scene-image winter" src="assets/winter-scene.jpg" alt="" decoding="async"></div>
<canvas id="atmosphere" aria-hidden="true"></canvas><img id="maple-sprite" src="assets/maple-leaf.png" alt="" hidden>
<main id="diary-main" inert>
<button id="home-button" class="home-button" aria-label="返回首页" title="返回首页" hidden>⌂</button>
<div class="top-chrome"><header><div><h1 class="diary-heading">我 <span class="name-cross"><img src="assets/black-cross.png" alt="黑色❌"></span> 你 <small>の恋爱日记</small></h1><span id="greeting" class="greeting"></span></div><button class="avatar-button" id="account" aria-label="我们的小屋"><span id="avatar-letter">泽</span><span id="account-name"></span></button></header>
<div class="season-toolbar"><button id="connection-status" class="connection-status" type="button" aria-live="polite">等待登录</button><div id="season-picker"></div><button id="landscape-open" class="landscape-link">看风景 ↗</button></div>
</div><section id="home-view"><div class="scene-breath"><span id="season-label"></span><span id="together-days"></span></div><div id="home-menu" class="home-menu"></div><button id="countdown" class="meeting-strip"></button><div class="inbox-heading"><h2>你的小纸条 <span id="inbox-count"></span></h2><div id="inbox-tools"></div></div><div id="inbox" class="inbox"></div></section>
<section id="feature-view" hidden><div class="section-heading"><div class="feature-identity"><div class="feature-title"><h2 id="section-title"></h2><p id="section-desc"></p></div></div><div class="section-tools"><button id="add-product" class="outline" data-tip="两个人都可以新增商品">＋ 商品</button><button id="section-action" class="outline"></button></div></div>
<div class="feature-toolbar"><div id="search-shell" class="search-shell"><button id="search-toggle" class="search-toggle" aria-label="展开搜索" aria-expanded="false" aria-controls="search-field" data-tip="按商品名、分类或备注搜索"><span class="morph-plus" aria-hidden="true"></span></button><span class="search-label">搜索</span><div id="search-field" class="search-field"><div><input id="record-search" type="search" maxlength="80" placeholder="搜索小铺商品" aria-label="搜索小铺商品" tabindex="-1"></div></div></div><button id="view-toggle" class="view-toggle" aria-label="切换为网格" aria-pressed="false"><span class="morph-layout" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span id="view-toggle-label">网格</span></button><button id="record-view-toggle" class="view-toggle" aria-label="切换记录为网格" aria-pressed="false" hidden><span class="morph-layout" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span id="record-view-label">网格</span></button></div><div id="context-tip" class="context-tip" role="status" aria-live="polite"></div><div id="content" role="region" aria-label="功能内容，可上下滚动" tabindex="0"></div></section>
</main>
<div id="cartbar" class="cartbar hidden"></div>
<div id="tap-effects" aria-hidden="true"></div><div id="ui-tooltip" role="tooltip"></div><dialog id="modal"><div id="dialog-tap-effects" aria-hidden="true"></div><div class="dialog-head"><h2 id="modal-title"></h2><button class="close" id="close-modal" aria-label="关闭">×</button></div><div id="modal-body"></div><div id="submission-feedback" class="submission-feedback" role="status" aria-live="polite"></div></dialog><div role="status" id="toast"></div>
<button id="landscape-close" class="scenery-exit">返回恋爱日记</button>
<section id="auth-view" class="auth-view" aria-labelledby="auth-title"><div class="auth-card"><span class="auth-mark" aria-hidden="true">✿</span><p class="auth-eyebrow">我 <span class="name-cross"><img src="assets/black-cross.png" alt="黑色❌"></span> 你 の恋爱日记</p><h2 id="auth-title">おかえり，回家啦。</h2><p class="auth-copy">登录后，打开只属于我们的小屋。</p><form id="login-form"><label class="form-field"><span>邮箱</span><input id="login-email" type="email" inputmode="email" autocomplete="username" required placeholder="你的登录邮箱"></label><label class="form-field"><span>密码</span><div class="password-field"><input id="login-password" type="password" autocomplete="current-password" required placeholder="你的专属密码"><button type="button" id="password-toggle" aria-label="显示密码" aria-pressed="false">显示</button></div></label><button class="primary wide" id="login-submit" type="submit">进入我们的小屋 ↗</button></form><p id="auth-message" class="auth-message" role="status" aria-live="polite"></p><small class="auth-footer">仅限我们两个人 · 照片与记录私密保存</small></div></section>
<script src="config.js"></script><script src="branding.js"></script><script src="cloud.js"></script><script src="seasons.js"></script><script src="ui-model.js"></script><script src="motion.js"></script><script src="private.js"></script><script src="status.js"></script><script src="meeting.js"></script><script src="app.js"></script><script src="atmosphere.js"></script><script src="ambience.js"></script></body></html>
